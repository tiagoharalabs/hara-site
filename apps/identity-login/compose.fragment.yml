services:
  zitadel-login:
    image: hara-identity-login:v4.16.0-hara.8
    environment:
      NEXT_PUBLIC_APPLICATION_NAME: HARA Identity
      NEXT_PUBLIC_THEME_ROUNDNESS: mid
      NEXT_PUBLIC_THEME_LAYOUT: side-by-side
      NEXT_PUBLIC_THEME_SPACING: compact
      NEXT_PUBLIC_THEME_APPEARANCE: material
    labels:
      - 'traefik.http.routers.zitadel-login.rule=Host(`${ZITADEL_DOMAIN}`) && PathPrefix(`/ui/v2/login`)'


  zitadel-dcr-gateway:
    image: hara-identity-dcr-gateway:v0.1.0
    restart: unless-stopped
    environment:
      HARA_DCR_GATEWAY_MODE: closed
      HARA_DCR_UPSTREAM_HOST: zitadel-api
      HARA_DCR_UPSTREAM_PORT: "8080"
      HARA_IDENTITY_HOST: auth.haralabs.com.br
      HARA_DCR_ALLOW_CUSTOM_SCHEMES: "true"
      PORT: "8082"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks: [identity]
    labels:
      - traefik.enable=true
      - traefik.docker.network=hara-identity
      - traefik.http.services.zitadel-dcr-gateway.loadbalancer.server.port=8082
      - 'traefik.http.routers.zitadel-dcr-gateway.rule=Host(`${ZITADEL_DOMAIN}`) && PathPrefix(`/oauth/v2/register`)'
      - traefik.http.routers.zitadel-dcr-gateway.entrypoints=web
      - traefik.http.routers.zitadel-dcr-gateway.service=zitadel-dcr-gateway
      - traefik.http.routers.zitadel-dcr-gateway.priority=800

  zitadel-oauth-metadata:
    image: hara-identity-oauth-metadata:v1.0.0
    restart: unless-stopped
    entrypoint: ["node", "/app/server.mjs"]
    environment:
      HARA_IDENTITY_ISSUER: https://auth.haralabs.com.br
      PORT: "8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks: [identity]
    labels:
      - traefik.enable=true
      - traefik.docker.network=hara-identity
      - traefik.http.services.zitadel-oauth-metadata.loadbalancer.server.port=8081
      - 'traefik.http.routers.zitadel-oauth-metadata.rule=Host(`${ZITADEL_DOMAIN}`) && Path(`/.well-known/oauth-authorization-server`)'
      - traefik.http.routers.zitadel-oauth-metadata.entrypoints=web
      - traefik.http.routers.zitadel-oauth-metadata.service=zitadel-oauth-metadata
      - traefik.http.routers.zitadel-oauth-metadata.priority=700

  zitadel-assets:
    image: hara-identity-login:v4.16.0-hara.8
    restart: unless-stopped
    entrypoint: ["node", "/app/hara-static-server.mjs"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/favicon/site.webmanifest"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - traefik.enable=true
      - traefik.docker.network=hara-identity
      - traefik.http.services.zitadel-assets.loadbalancer.server.port=8080
      - 'traefik.http.routers.zitadel-assets.rule=Host(`${ZITADEL_DOMAIN}`) && (PathPrefix(`/favicon`) || Path(`/favicon.ico`) || Path(`/hara-logo-light.svg`) || Path(`/hara-logo-dark.svg`) || Path(`/zitadel-logo-light.svg`) || Path(`/zitadel-logo-dark.svg`))'
      - traefik.http.routers.zitadel-assets.entrypoints=web
      - traefik.http.routers.zitadel-assets.service=zitadel-assets
      - traefik.http.routers.zitadel-assets.priority=500
