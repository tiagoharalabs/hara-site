name: HARA Site Main Provenance Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: hara-site-main-provenance-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate reviewed site landing and main provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision without external actions
        shell: bash
        env:
          HARA_GIT_TOKEN: ${{ github.token }}
          HARA_REPOSITORY: ${{ github.repository }}
          HARA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          HARA_BASIC_AUTH="$(printf 'x-access-token:%s' "$HARA_GIT_TOKEN" | base64 -w0)"
          git init --quiet .
          git remote add origin "https://github.com/${HARA_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${HARA_BASIC_AUTH}" fetch --quiet --no-tags --depth=1 origin "$HARA_HEAD_SHA"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$HARA_HEAD_SHA"
          unset HARA_GIT_TOKEN HARA_BASIC_AUTH
          printf 'CHECKOUT_EXACT_SHA=PASS:%s\n' "$HARA_HEAD_SHA"

      - name: Verify main push has reviewed PR provenance
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HARA_REPOSITORY: ${{ github.repository }}
          HARA_HEAD_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          merged_prs=()
          for attempt in 1 2 3 4 5 6; do
            mapfile -t merged_prs < <(gh api "repos/${HARA_REPOSITORY}/commits/${HARA_HEAD_SHA}/pulls" --jq '.[] | select(.merged_at != null and .base.ref == "main") | .number')
            (( ${#merged_prs[@]} >= 1 )) && break
            (( attempt < 6 )) && sleep 2
          done
          if (( ${#merged_prs[@]} < 1 )); then
            printf 'UNREVIEWED_MAIN_PUSH_DETECTED=TRUE\n' >&2
            printf 'MAIN_PUSH_SHA=%s\n' "$HARA_HEAD_SHA" >&2
            exit 1
          fi
          printf 'MAIN_PUSH_PROVENANCE=MERGED_PR\n'
          printf 'ASSOCIATED_MERGED_MAIN_PR_COUNT=%s\n' "${#merged_prs[@]}"

      - name: Validate deployable structure
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f README.md
          test -f index.html
          test -f package.json
          test -f wrangler.jsonc
          test -f src/worker.js
          node --check src/worker.js
          python3 - <<'PY'
          import json
          with open('package.json', encoding='utf-8') as h:
              p=json.load(h)
          assert p.get('private') is True
          assert isinstance(p.get('scripts'),dict)
          print('HARA_SITE_STRUCTURE=PASS')
          PY

      - name: Enforce public repository sanitization
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          tracked=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          def secret_path(path):
              name=Path(path).name
              if name=='.dev.vars' or (name.startswith('.dev.vars.') and name!='.dev.vars.example'): return True
              if name=='.env' or (name.startswith('.env.') and name!='.env.example'): return True
              if name in {'id_rsa','id_ed25519'} or name.endswith(('.pem','.p12','.pfx')): return True
              return False
          leaked=[p for p in tracked if secret_path(p)]
          if leaked: raise SystemExit('TRACKED_LOCAL_SECRET_FILE='+','.join(leaked))
          deployable=[]
          for path in tracked:
              p=Path(path)
              if path in {'index.html','styles.css','wrangler.jsonc'} or path.startswith(('public/','src/')):
                  try:
                      if p.stat().st_size<=2_000_000: deployable.append(path)
                  except OSError: pass
          patterns={
              'PERSONAL_HOME_PATH':re.compile(r'/home/[A-Za-z0-9._-]+/'),
              'HARA_INTERNAL_RUNTIME_PATH':re.compile(r'/(?:srv/hara|tmp_hara)(?:/|$)'),
              'RFC1918_IPV4':re.compile(r'(?<![0-9])(?:10[.](?:[0-9]{1,3}[.]){2}[0-9]{1,3}|192[.]168[.](?:[0-9]{1,3}[.])[0-9]{1,3}|172[.](?:1[6-9]|2[0-9]|3[01])[.](?:[0-9]{1,3}[.])[0-9]{1,3})(?![0-9])'),
              'PRIVATE_KEY_HEADER':re.compile('-----BEGIN '+'(?:RSA |EC |OPENSSH )?'+'PRIVATE KEY-----'),
              'GITHUB_TOKEN':re.compile(r'(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}'),
              'AWS_ACCESS_KEY':re.compile(r'AKIA[0-9A-Z]{16}')}
          findings=[]
          for path in deployable:
              try:text=Path(path).read_text(encoding='utf-8')
              except (UnicodeDecodeError,OSError):continue
              for label,pattern in patterns.items():
                  if pattern.search(text): findings.append(f'{label}:{path}')
          status=Path('public/observabilidade/status.json')
          if status.exists():
              text=status.read_text(encoding='utf-8')
              for label,pattern in {
                  'PUBLIC_FLEET_NODE_ID':re.compile(r'(?i)(nucleo-a|sentinela-[abcd]|ninja[ -]blue|hara-fleet-(?:n150|storage|sentinela-[abcd])-node)'),
                  'PUBLIC_SSH_TOPOLOGY':re.compile(r'(?i)(túnel ssh|ssh tunnel|loopback)')}.items():
                  if pattern.search(text): findings.append(f'{label}:{status}')
          if findings: raise SystemExit('PUBLIC_SANITIZATION_FINDINGS='+','.join(sorted(set(findings))))
          print('HARA_SITE_PUBLIC_SANITIZATION=PASS')
          print('LOW_VALUE_COMMIT_SUBJECT_GATE=REMOVED')
          print('DOCUMENTATION_GIT_ADD_DOT_GATE=REMOVED')
          PY
